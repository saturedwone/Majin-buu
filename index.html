<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satured Hub Protector</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* SPLASH */
#splash {
  position: fixed;
  width: 100%;
  height: 100%;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.loader {
  margin-top: 20px;
  width: 200px;
  height: 5px;
  background: #111;
}

.loader-bar {
  width: 0%;
  height: 100%;
  background: #fff;
  animation: load 2s forwards;
}

@keyframes load {
  to { width: 100%; }
}

/* MAIN */
.container {
  display: none;
  text-align: center;
  padding: 20px;
}

/* TEXTBOX (único con color diferente) */
textarea {
  width: 90%;
  height: 150px;
  background: #111;
  border: 1px solid #fff;
  color: #fff;
  padding: 10px;
  border-radius: 6px;
}

/* BOTONES */
button {
  margin-top: 15px;
  padding: 12px;
  width: 90%;
  background: #111;
  color: #fff;
  border: 1px solid #fff;
  border-radius: 6px;
  cursor: pointer;
}

/* BOTÓN DISCORD */
.discord {
  background: #5865F2;
  border: none;
}

.result {
  margin-top: 20px;
  word-break: break-all;
}
</style>
</head>

<body>

<div id="splash">
  <h2>Loading...</h2>
  <div class="loader">
    <div class="loader-bar"></div>
  </div>
</div>

<div class="container" id="main">
  <h2>this code it's protected by Satured hub</h2>

  <!-- BOTÓN DISCORD -->
  <button class="discord" onclick="window.open('https://discord.gg/KfY9ZC23R')">
    Discord
  </button>

  <!-- TEXTBOX -->
  <textarea id="code" placeholder="Paste your code..."></textarea>

  <!-- BOTÓN LOADSTRING -->
  <button onclick="generate()">Do Loadstring</button>

  <div class="result" id="result"></div>
</div>

<script>
// splash
setTimeout(() => {
  document.getElementById("splash").style.display = "none";
  document.getElementById("main").style.display = "block";
}, 2000);

// generar loadstring simple (sin API para evitar errores)
function generate() {
  const code = document.getElementById("code").value;

  if (!code) {
    alert("Put code");
    return;
  }

  const encoded = btoa(code);
  const loadstring = `loadstring(game:HttpGet("data:text/plain;base64,${encoded}"))()`;

  document.getElementById("result").innerText = loadstring;
}
</script>

</body>
</html>
